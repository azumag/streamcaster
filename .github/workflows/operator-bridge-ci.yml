name: Operator Bridge CI

on:
  push:
    paths:
      - 'operator-bridge/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/operator-bridge-ci.yml'
  pull_request:
    paths:
      - 'operator-bridge/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/operator-bridge-ci.yml'

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace operator-bridge
      - run: npm test --workspace operator-bridge -- --runInBand
