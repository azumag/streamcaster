name: Camera Control Prototype

on:
  pull_request:
    paths:
      - 'camera-control/**'
      - '.github/workflows/camera-control-ci.yml'
  push:
    branches: [main]
    paths:
      - 'camera-control/**'
      - '.github/workflows/camera-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: camera-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m compileall -q .

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: camera-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/ui_offline_smoke.py
