name: Controller CI Pipeline

on:
  push:
    branches: [main, development, 'feature/**', 'fix/**']
    paths:
      - '.node-version'
      - 'controller/**'
      - 'package*.json'
      - 'Dockerfile.controller'
      - '.dockerignore'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/controller-ci.yml'
  pull_request:
    branches: [main, development]
    paths:
      - '.node-version'
      - 'controller/**'
      - 'package*.json'
      - 'Dockerfile.controller'
      - '.dockerignore'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/controller-ci.yml'

jobs:
  test:
    name: Test Controller
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: controller/package-lock.json

      - name: Install dependencies
        working-directory: ./controller
        run: npm ci --workspaces=false --ignore-scripts

      - name: Run lint
        working-directory: ./controller
        run: npm run lint

      - name: Audit locked dependencies
        working-directory: ./controller
        run: npm audit --workspaces=false --audit-level=high

      - name: Run tests
        working-directory: ./controller
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '22.23.4'
        uses: codecov/codecov-action@v4
        with:
          directory: ./controller/coverage
          flags: controller
          name: controller-coverage
          fail_ci_if_error: false

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: controller/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: ./controller
        run: npm ci --workspaces=false --ignore-scripts

      - name: Create test video files
        working-directory: ./videos
        run: |
          # Create dummy video files for testing
          ffmpeg -f lavfi -i testsrc=duration=5:size=320x240:rate=1 -f lavfi -i sine=frequency=1000:duration=5 -c:v libx264 -c:a aac -shortest test1.mp4
          ffmpeg -f lavfi -i testsrc=duration=3:size=320x240:rate=1 -f lavfi -i sine=frequency=500:duration=3 -c:v libx264 -c:a aac -shortest test2.mp4

      - name: Start controller in background
        working-directory: ./controller
        run: |
          npm start &
          echo $! > controller.pid

      - name: Wait for controller to start
        run: |
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/api/health; then
              echo "Controller is ready!"
              break
            fi
            echo "Waiting for controller... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "Controller failed to start"
            exit 1
          fi

      - name: Test API endpoints
        run: |
          # Test status endpoint
          curl -f http://localhost:8080/api/status
          
          # Test videos endpoint
          curl -f http://localhost:8080/api/videos
          
          # Test health endpoint
          curl -f http://localhost:8080/api/health

      - name: Stop controller
        working-directory: ./controller
        run: |
          if [ -f controller.pid ]; then
            kill $(cat controller.pid) || true
            rm controller.pid
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './controller'
          format: 'sarif'
          output: 'trivy-controller.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-controller.sarif'
          category: 'trivy-controller'

  docker-test:
    name: Build Controller Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: false
          tags: streamcaster-controller:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
