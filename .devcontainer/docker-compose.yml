version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - claude-code-config:/home/node/.config/claude-code
    command: sleep infinity
    network_mode: host
    environment:
      - NODE_ENV=development

volumes:
  claude-code-config: